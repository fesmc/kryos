# configme manifest for kryos.
# Pins: stable (== main) for every dependency (vilma2, PlasticIceSheet: main),
# except fesm-utils at phase0-kryos (the fesm-utils additions kryos needs,
# design section 12, not yet merged to dev) and yelmo at dev (the till_cf
# fields of the Yelmo adapter; input/ is synchronised with it, make
# input-check); a tagged release pins the dependency tags.
package = "kryos"
deps = [
    "fesm-utils:phase0-kryos",
    "yelmo:dev",
    "FastIsostasy:stable",
    "chion:stable",
    "insol:stable",
    "vilma2:main",
    "PlasticIceSheet:main",
]
