# configme manifest for kryos.
# Pins: stable (== main) for every dependency, except fesm-utils at dev while
# the fesm-utils additions kryos needs (design section 12) are developed; a
# tagged release pins the dependency tags.
package = "kryos"
deps = [
    "fesm-utils:dev",
    "yelmo:stable",
    "FastIsostasy:stable",
    "chion:stable",
    "insol:stable",
]
