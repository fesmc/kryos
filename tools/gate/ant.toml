# Gate ant (regression-design.md §1.1): yelmox_Antarctica without the phase 2
# plugins (relax, opt), 1000 yr from a cold start, lossless output.
gate     = "ant"
base     = "yelmox/yelmox_Antarctica.nml"
p        = ["ctrl.time_end=1000", "ctrl.write_lossless=True", "tm_2D.dt=100",
            "tm_2Dsm.dt=10", "tm_1D.dt=10", "tm_rst.dt=500",
            "sim.relax=False", "sim.opt=False"]
time_end = 1000.0
chunks   = [0.0, 500.0, 1000.0]
restart_times = [500.0, 1000.0]

[instances]
domain     = "Antarctica"
ice        = "ice_ant"
geo        = "geo_ant"
climate    = "climate_ant"
surface    = "surface_ant"
shelf      = "shelf_ant"
geothermal = "ghf_ant"
sediments  = "sed_ant"
forcing    = "forcing"
geo_glob   = "geo_glob"
