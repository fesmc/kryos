# Weighted ensemble v2: tau_b multipliers of the plastic ice and the Earth (shifts of log10 viscosity of the 3-D Earth, Bagge 2021,
# globally and by region; plastic_earth_shift.jl), NH-32KM, ANT-16KM and PAT-PAL-8KM; the data groups that judge: every RSL
# group, ESL, the GNSS uplift rates of Fennoscandia, Hudson Bay, Greenland and Antarctica ([[gnss]]) and the
# ice-core elevations of Greenland ([cores]) and the Earth's rotation ([rotation]). The error model
# from ens-v1 wave 1 (errmodel.toml there); GNSS: starting values.
# docs/dev/plastic-ensemble-design.md.
#   tools/levante/plastic_ensemble.sh start tools/levante/plastic_ensemble_v2.toml <ensemble folder>
[scale]                                  # the parameters: plastic_taub_scale.jl
taub_files    = ["{fesmdata}/North/NH-32KM/NH-32KM_IceHistory-PaleoMIST_taub.nc",
                 "{fesmdata}/Antarctica/ANT-16KM/ANT-16KM_IceHistory-PaleoMIST_taub.nc",
                 "{fesmdata}/PatagoniaPaleo/PAT-PAL-8KM/PAT-PAL-8KM_IceHistory-PaleoMIST_taub.nc"]
regions_files = ["{fesmdata}/North/NH-32KM/NH-32KM_REGIONS.nc",
                 "{fesmdata}/Antarctica/ANT-16KM/ANT-16KM_REGIONS.nc",
                 "{fesmdata}/PatagoniaPaleo/PAT-PAL-8KM/PAT-PAL-8KM_REGIONS.nc"]
nodes_ka      = [80, 60, 40, 25, 20, 15, 10, 5, 0]
pinned_ka     = [0]                      # the present day is Stage 1's fit

[[scale.groups]]
name          = "Laurentide"             # North America without Greenland
region        = 1
greenland     = false
tie           = [[25, 20], [15, 10]]     # fewer deglacial nodes (the v2 zigzag)
corr_time_kyr = 10.0                     # MIS 3-4 not tied to the deglacial nodes

[[scale.groups]]
name   = "Greenland"
region = 1
greenland = true
tie    = [[80, 60]]

[[scale.groups]]
name     = "Fennoscandia"                # Eurasia less the British Isles, the Russian Arctic and Svalbard
region   = 2
codes    = [10201, 10202, 10203]
codes_in = false
tie      = [[80, 60, 40]]

[[scale.groups]]
name   = "Barents-Kara"                  # Russian Arctic and Svalbard
region = 2
codes  = [10201, 10203]
tie    = [[80, 60, 40]]

[[scale.groups]]
name   = "British-Irish"
region = 2
codes  = [10202]
tie    = [[80, 60, 40, 25]]

[[scale.groups]]
name   = "West Antarctica"               # with the Antarctic Peninsula
region = 3
codes  = [20101, 20103]
tie    = [[80, 60, 40, 25, 20]]

[[scale.groups]]
name     = "East Antarctica"
region   = 3
codes    = [20101, 20103]
codes_in = false
tie      = [[80, 60, 40, 25, 20]]

[[scale.groups]]
name   = "Patagonia"                     # no RSL data: prior only (its load reaches the far field)
region = 4
tie    = [[80, 60, 40, 25, 20]]

[prior]                                  # log factors: N(0, C), sd ramped from 0 at 0 ka, exponential correlation in time per group
sigma         = 0.3
ramp_ka       = 10.0
corr_time_kyr = 20.0
theta_max     = 1.5

[ensemble]
n          = 49                          # members besides the prior mean (m000)
seed       = 1
obs_groups = ["Laurentide", "Greenland", "Fennoscandia", "Barents", "Antarctica", "far field"]   # pm_compare.jl's GROUPS
compare_max_age_ka = 25.0                # judging and the comparison with the references: GLAC1D's own GIA ends at 26 ka
bar        = ["pub-PMIST", "pub-GLAC1D"]  # the cut per group: as good as the best published reconstruction (plastic_ensemble.jl weights)
fixed_cut  = []                        # groups that keep the plain cut; ESL always does (its target is the Spratt stack, never a bar
                                       # reference's score: plastic_ensemble.jl plain_cut_groups)

[likelihood."Laurentide"]                # model error per data group: ens-v1 wave 1 (plastic_ensemble.jl errmodel, top 6 members)
sigma_m = 14.0
corr_dist_km = 750.0
corr_time_kyr = 40.0
[likelihood."Greenland"]
sigma_m = 40.0
corr_dist_km = 25.0
corr_time_kyr = 40.0
[likelihood."Fennoscandia"]              # the Fennoscandia/Barents values of ens-v1, split 2026-11-12: refit
sigma_m = 26.0
corr_dist_km = 500.0
corr_time_kyr = 40.0

[likelihood."Barents"]
sigma_m = 26.0
corr_dist_km = 500.0
corr_time_kyr = 40.0

[likelihood."Antarctica"]
sigma_m = 10.0
corr_dist_km = 250.0
corr_time_kyr = 40.0
[likelihood."far field"]
sigma_m = 23.0
corr_dist_km = 100.0
corr_time_kyr = 20.0
[likelihood."GNSS Fennoscandia"]         # GNSS: sigma_m [mm/yr], no time term; starting values (plastic_ensemble.jl errmodel)
sigma_m = 1.0
corr_dist_km = 300.0
[likelihood."GNSS Hudson Bay"]
sigma_m = 1.0
corr_dist_km = 300.0
[likelihood."GNSS Greenland"]            # fitted as Fennoscandia's and Hudson Bay's (errmodel refs=E1D-ES1-E, the 6 best Earths of
sigma_m = 2.0                            # wave A of the Earth search: kryos-work/scores-v3/errfit-gnss): what no model of ours has,
corr_dist_km = 1000.0                    # the response to the loss since the Little Ice Age on a weak upper mantle (3-5 mm/yr on the
[likelihood."GNSS Antarctica"]           # west and south-east coasts, Adhikari et al. 2021) and the elastic correction's error; in
sigma_m = 4.0                            # Antarctica the recent loss of the Amundsen Sea and the northern Peninsula on a weak mantle
corr_dist_km = 250.0                     # (Martín-Español et al. 2016: every GIA model 7.7-9.8 mm/yr WRMS in the Amundsen Sea)

[earth]                                  # the Earth: shifts of log10(eta) of the 3-D field (VILMA2 visc_shift_file)
sigma        = 0.5                       # prior sd [dex] of every shift, independent
theta_max    = 1.5                       # [dex]
boundary_km  = 670.0                     # the upper mantle (with the lithosphere) above, the lower mantle below
regions_file = "{kryos_data}/plastic/earth_regions_v2.nc"   # plastic_ensemble.jl earth-regions of these [[earth.regions]]
buffer_km    = 300.0                     # the masks: 1 within buffer_km of the region's tau_b domains, cos^2 to 0 over taper_km
taper_km     = 500.0
exclude_codes = [105]                    # Iceland (REGIONS region_2): no regional shift there (its domains are in the
                                         # Laurentide tau_b group, and it lies within Greenland's buffer)
[[earth.regions]]
name   = "Laurentide"
groups = ["Laurentide"]
[[earth.regions]]
name   = "Greenland"
groups = ["Greenland"]
[[earth.regions]]
name   = "Fennoscandia/Barents"
groups = ["Fennoscandia", "Barents-Kara", "British-Irish"]
[[earth.regions]]
name   = "West Antarctica"
groups = ["West Antarctica"]
[[earth.regions]]
name   = "East Antarctica"
groups = ["East Antarctica"]

[run]                                    # each member: a kryos run of this par file with its multiplier file
par        = "par/kryos_NH-ANT-PAT_plastic_vilma2.nml"
set        = ['kryos.restart_out="none"', 'ice_nor.out_plastic="none"', 'ice_ant.out_plastic="none"', 'ice_pat.out_plastic="none"',
              'geo_nor.out_2D="none"', 'geo_ant.out_2D="none"', 'geo_pat.out_2D="none"', 'geo_glob.out_2D="none"']
                                         # the product (2-D ice, the VILMA2 stream) comes from plastic_esmda.jl's product_set
scale_keys = ["ice_nor.taub_scale_file", "ice_ant.taub_scale_file", "ice_pat.taub_scale_file"]
domain_factor_file = "{kryos_data}/plastic/taub_domain_factor_v3.nc"   # Stage 1 with PAT
domain_factor_keys = ["ice_nor.taub_domain_factor_file", "ice_ant.taub_domain_factor_file", "ice_pat.taub_domain_factor_file"]
threads    = 64                          # 3-D Earth: 3.5-4.2 h on 64 (sci-v2-prior, -post, sci-v3-base, 2026-11-09), 3.0-4.3 h
                                         # (ens-v2 on Levante); VILMA2's toroidal flow (on by default) costs about 1.5 times
mem        = "30G"
time       = "11:00:00"                  # within albedo's 12h queue
throttle   = 25                          # 25 members + the weights job + one other run: within 30 jobs

[score]
# gnss_dir = "{fesmdata}/Records/GPS"   # the default (FesmData GPS v2.2.0: Schumacher2018, MIDAS, BIFROST2015, GNET,
#                                         MartinEspanol2016)

# The GNSS data groups (pm_compare.jl read_gnss; plastic_ensemble.jl: each a data group after obs_groups): the present-day uplift
# rate at the stations against dz_bed_rate of the member's last VILMA2 record. rate: gia = uplift_rate - uplift_rate_elastic
# (products that keep the elastic part), corrected = the authors' elastic-corrected uplift_rate, observed = as measured. box:
# [lon_min, lon_max, lat_min, lat_max]; entries of one name: one group, a station once; judge = false: reported only. Every
# group compares GIA alone: the data elastic-corrected (Hudson Bay's MIDAS stations: little present-day ice there).
[esl]                                    # global sea level against an independent (δ18O-based) curve: plastic_ensemble.jl [esl]
name             = "ESL"
product          = "Spratt2016"          # Spratt and Lisiecki 2016 stack (1 sigma) as given: 0 at 5 ka, -130 m at 24 ka (its anchor)
var              = "sl_short"
ages_ka          = [25.0, 22.5, 20.0, 17.5, 15.0, 12.5, 10.0]
reference_curves = ["Lambeck2014", "Waelbroeck2002", "Bintanja2008"]   # shown, not scored (Lambeck: far-field RSL, ours too)
model_var        = "bsl_ive"             # the model's ESL by what the record measures: a δ18O stack sees the mass of all grounded
                                         # ice, below flotation too (VILMA2 bsl_ive); "bsl" (the ice above flotation) is for a direct
                                         # curve of the mean sea surface (pm_compare.jl ESL_VARS)
spread_file      = "esl_spread.csv"      # the records' disagreement s(t) (tools/levante/esl_spread.jl: 10-13 m at 25-20 ka, 16 m at
                                         # 17.5 ka, 6-7 m at 12.5-10 ka): the model error at an age sqrt(sigma_m^2 + s(t)^2)
[likelihood."ESL"]                       # sigma_m: the part every age has (5 m), with s(t) of spread_file
sigma_m       = 5.0
corr_dist_km  = 1.0
corr_time_kyr = 10.0

[cores]                                  # ice-core elevation histories: plastic_ensemble.jl [cores]
name     = "ice cores (Greenland)"
product  = "Vinther2009"                 # Vinther et al. 2009: Camp Century, NGRIP, GRIP, DYE-3; elevation above sea level, the
                                         # bed's isostatic change included; 1 sigma 40 m (GRIP, NGRIP), 65 m (Camp Century, DYE-3)
ages_ka  = [11.0, 9.0, 7.0, 5.0, 3.0]    # every 2 kyr: the data errors (the uplift correction of Agassiz and Renland) are
                                         # correlated in time and not in the covariance
window_kyr = 0.5                         # the data at an age: the mean of the 20-yr values within ±0.25 kyr
ice      = "ice_nor"                     # the model: z_srf - z_sl of ice_nor.nc on NH-32KM
domain   = "North"
grid     = "NH-32KM"

[likelihood."ice cores (Greenland)"]     # starting values: refit by errmodel. sigma_m: the surface of the plastic ice on 32 km
sigma_m       = 75.0                     # misses the present elevation of the sites by 30-380 m (RMS 240 m, C7); in the change
corr_dist_km  = 500.0                    # relative to the present most of it cancels: a third of it. L_t: the time scale of the
corr_time_kyr = 5.0                      # Holocene thinning; L_x: the sites are 300-1300 km apart

[rotation]                               # the present-day rotation of the Earth from GIA: plastic_ensemble.jl [rotation]
name = "rotation"
tpw_axis_deg = -79.0                     # the axis of the TPW components: the observed direction (Argus and Gross 2004)
[[rotation.data]]
quantity = "J2dot"                       # [1e-11/yr], unnormalized J2 (J2 = -√5 C̄20)
value    = -5.7                          # observed -3.7 ± 0.1 (SLR, 1976-1990; -3.4 to -4.0 by the window: Mitrovica et al. 2015)
sd       = 0.6                           # less the melt of glaciers and ice sheets 1900-1990, +2.0 ± 0.4: the GIA part
sd_model = 1.0                           # -5.7 ± 0.5 (Nakada et al. 2015, GJI 202, 976, doi:10.1093/gji/ggv198, Table 3; Mitrovica
                                         # et al. 2015, Sci. Adv. 1, e1500679, doi:10.1126/sciadv.1500679). sd_model: the loading before
                                         # the run's start (80 ka) and the run's own ice change over its last record interval (500 yr:
                                         # C7's J2dot over the two last intervals differs by 0.9)
source   = "Nakada et al. 2015; Mitrovica et al. 2015"
[[rotation.data]]
quantity = "TPW along"                   # [deg/Myr], the true polar wander velocity along tpw_axis_deg: observed 3.5 mas/yr = 0.97
value    = 0.6                           # deg/Myr toward 79 W relative to the mean lithosphere (Argus and Gross 2004, GRL 31, L06614,
sd       = 0.3                           # doi:10.1029/2004GL019657); the GIA part 33 ± 18 % (Adhikari et al. 2018, EPSL 502, 126,
sd_model = 0.2                           # doi:10.1016/j.epsl.2018.08.059: mantle convection the rest) to 0.85 deg/Myr (Nakada et al.
                                         # 2015; Adhikari and Ivins 2016, Sci. Adv. 2, e1501693); the 20th-century melt < 0.1 deg/Myr
source   = "Argus and Gross 2004; Adhikari et al. 2018; Nakada et al. 2015"
[[rotation.data]]
quantity = "TPW across"                  # [deg/Myr], 90 deg east of the axis: the GIA models point at 75-79 W (Nakada et al. 2015),
value    = 0.0                           # along the observed motion; the non-GIA part (convection) is of unknown direction, so the
sd       = 0.3                           # across component has the along one's sd. A velocity, not rate and direction: where the rate
sd_model = 0.2                           # is near zero its direction is noise, and the components stay Gaussian
source   = "Argus and Gross 2004; Nakada et al. 2015"
[likelihood."rotation"]                  # the model error is per quantity (sd_model): sigma_m 0, not fitted
sigma_m      = 0.0
corr_dist_km = 1.0

[[gnss]]
name    = "GNSS Fennoscandia"
product = "BIFROST2015"                  # Kierulf et al. 2021, ITRF2008
rate    = "gia"
[[gnss]]
name    = "GNSS Hudson Bay"              # the Laurentide area of strong uplift around Hudson Bay
product = "Schumacher2018"               # Schumacher et al. 2018, elastic-corrected
rate    = "corrected"
box     = [[-100.0, -65.0, 50.0, 70.0]]
[[gnss]]
name      = "GNSS Hudson Bay"            # and the MIDAS stations not in Schumacher's set (little present-day ice there)
product   = "MIDAS"                      # Blewitt et al. 2016, IGS20, not corrected
rate      = "observed"
box       = [[-100.0, -65.0, 50.0, 70.0]]
min_years = 5.0                          # series of at least 5 years
[[gnss]]
name    = "GNSS Greenland"
product = "GNET"                         # Berg et al. 2024, IGS14; sd combined with the elastic part's
rate    = "gia"                          # observed less the elastic response to the ice loss of 2000-2020 (1.5-13.8 mm/yr)
[[gnss]]
name    = "GNSS Antarctica"
product = "MartinEspanol2016"            # Martín-Español et al. 2016, ITRF2008, elastic-corrected (REAR, the Antarctic ice loss of
rate    = "corrected"                    # 2009-2013: up to 16-19 mm/yr in the Amundsen Sea, -2.4 to -0.5 in Queen Maud Land)

# The reconstructions the members are compared with (plastic_ensemble.jl reference_series), named as in docs/science/results.md: each with its own GIA, and its ice under
# VILMA2 (toroidal flow) with the members' 3-D Earth (prior mean), its radial mean (Bagge1D) and Gowan's 1-D Earth (gia_refcorr.sh
