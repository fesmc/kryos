project:
  type: website
  output-dir: _site
  render:
    - "*.md"
    - "*.qmd"
    - "!README.md"
    - "!design.md"
    - "!dev/"
    - "!study/"

website:
  title: "kryos"
  description: "Documentation for kryos, the component-based ice-sheet and solid-Earth modelling framework"
  repo-url: https://github.com/fesmc/kryos
  repo-subdir: docs
  repo-actions: [edit, issue]
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.md
      - text: "Getting started"
        href: getting-started.md
      - text: "Model"
        menu:
          - text: "Architecture"
            href: architecture.qmd
          - text: "Global hub and regional domains"
            href: global-hub.qmd
          - text: "---"
          - text: "PlasticIceSheet (ice)"
            href: backend-plastic.md
          - text: "VILMA2 (solid Earth)"
            href: backend-vilma2.md
          - text: "smb_simple (surface)"
            href: backend-smb-simple.md
      - text: "Reference"
        menu:
          - text: "Par files"
            href: reference-par-files.md
          - text: "Developer notes"
            href: developer-notes.md
          - text: "---"
          - text: "In development: implied mass balance"
            href: implied-mb.md

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    html-math-method: katex
    link-external-newwindow: true
